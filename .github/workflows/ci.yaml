name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # New Go and dependency advisories land without code changes.
    - cron: "0 13 * * 1"

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

      - name: Forbidden-data check
        run: ./scripts/check-forbidden-data.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o epack-collector-jumpcloud ./cmd/epack-collector-jumpcloud

      - name: Verify binary runs
        run: ./epack-collector-jumpcloud --version

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o epack-collector-jumpcloud ./cmd/epack-collector-jumpcloud

      - name: Install epack-conformance
        run: |
          EPACK_VERSION="$(go list -m -f '{{.Version}}' github.com/locktivity/epack)"
          echo "Installing epack-conformance at ${EPACK_VERSION}"
          go install -tags conformance github.com/locktivity/epack/cmd/epack-conformance@"${EPACK_VERSION}"

      - name: Run conformance tests
        run: epack-conformance collector ./epack-collector-jumpcloud --level standard
